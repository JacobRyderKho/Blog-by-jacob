<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script
      src="https://kit.fontawesome.com/f90068558c.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="main-header">
        <h3 class="header-info">
          <img src="assets/header-icon.png" class="logo" />
          <p>Cobee The Coder</p>
        </h3>
        <nav>
          <a href="index.html">Project</a>
          <a href="contact.html">Contact</a>
          <a href="about.html">About Us</a>
        </nav>
      </div>
    </header>
    <main>
      <div class="contact-container">
        <div class="ilustration">
          <img
            class="illustration-img"
            src="assets/profile.jpg"
            alt=""
            width="800px"
          />
        </div>
        <div class="contact">
          <img
            class="profile-contact-img"
            src="assets/profile-contact.png"
            alt=""
          />
          <h1>Contact Me</h1>
          <p>Please feel free to contact me</p>
          <h4>Your Information</h4>
          <form
            action="https://formsubmit.co/jacob@sch.highscope.or.id"
            method="POST"
          >
            <input type="hidden" name="_captcha" value="false" />
            <input type="hidden" name="_next" value="https:/127.0.0.1:5501/contact.html">
            <div class="form-container">
              <!-- Input Name Column -->
              <div class="input-container">
                <div class="icon">
                  <i class="fas fa-user"></i>
                </div>
                <div class="form-input">
                  <input
                    class="input-item"
                    type="text"
                    name="name"
                    id="name"
                    placeholder=""
                  />
                  <label for="name" class="form-label">Name</label>
                </div>
              </div>

              <!-- Input City Column -->
              <div class="input-container">
                <div class="icon">
                  <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="form-input">
                  <input
                    class="input-item"
                    type="text"
                    name="city"
                    id="city"
                    placeholder=""
                  />
                  <label for="city" class="form-label">City</label>
                </div>
              </div>

              <!-- Input Email Column -->
              <div class="input-container">
                <div class="icon">
                  <i class="far fa-envelope-open"></i>
                </div>
                <div class="form-input">
                  <input
                    class="input-item"
                    type="text"
                    name="email"
                    id="email"
                    placeholder=""
                  />
                  <label for="email" class="form-label">Email</label>
                </div>
              </div>

              <!-- Input Message Column -->
              <div class="textarea-container">
                <div class="icon">
                  <i class="fas fa-comment"></i>
                </div>
                <div class="form-textarea">
                  <textarea
                    class="textarea"
                    type="text"
                    name="message"
                    id="message"
                    cols="52"
                    rows="8"
                    placeholder=""
                  ></textarea>
                  <label for="message" class="form-label">Message</label>
                </div>
              </div>
            </div>

            <input type="submit" value="Submit" class="submit" />
          </form>
        </div>
      </div>
      <div class="modal-container">
        <div class="modal">
          <img src="assets/profile.jpg" alt="" />
          <h3>Message Sent</h3>
          <p>Thank you for submitting !</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="center-footer">
        <div class="main-footer">
          <div class="left-footer">
            <h3 class="info-left"><b>Address</b></h3>
            <p class="info-left">Jalan Mayoruslan Lorong Perkebunan No.30</p>
          </div>
          <div class="right-footer">
            <h3 class="info-right"><b>Contacts</b></h3>
            <p class="info-right">Phone:082184465368</p>
            <p class="info-right">Instagram : @jacobryderkho</p>
          </div>
        </div>

        <div class="main-footer">
          <p class="info-center">Designed by Jacob</p>
        </div>
      </div>
    </footer>
  </body>
  <script src="script.js"></script>
  i
</html>
